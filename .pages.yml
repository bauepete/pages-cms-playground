media:
  input: public/images
  output: /images
content:
  - name: pages
    label: Seiten
    type: collection
    path: content/pages
    filename:
      template: {title}.md
      field: true
    fields:
      - name: title
        label: Titel
        type: string
        required: true
        
      - name: content
        label: Inhalt
        type: block
        list: true
        blockKey: type
        blocks:
          - name: image
            label: Bild
            fields:
              - name: src
                type: image
              - name: alt
                type: string

          - name: sectionTitle
            label: Überschrift 1
            fields:
              - name: text
                type: string
  - name: posts
    label: Posts
    type: collection
    path: src/posts
    fields:
      - name: title
        type: string
      - name: body
        type: rich-text
  - name: siteSettings
    label: Site settings
    type: file
    path: src/_data/site.json
    fields:
      - name: title
        type: string
      - name: description
        type: text
      - name: url
        type: string
  - name: docs
    label: Docs
    type: group
    items:
      - name: docsPages
        label: Docs Pages
        type: collection
        path: content/docsPages
        fields:
          - name: title
            type: string

      - name: references
        label: References
        type: group
        items:
          - name: publications
            label: Publications
            type: file
            path: data/publications.json
            format: json
            list: true
            fields:
              - name: title
                type: string
              
actions:
  - name: deploy-site
    label: Deploy site
    workflow: pages-cms-action.yml
